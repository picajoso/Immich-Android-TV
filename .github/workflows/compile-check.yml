name: Compile check

# Debug build with placeholder Firebase/strings files, so pull requests can be
# compiled without the release secrets.
on:
  pull_request:
  push:
    branches: [ "redesign-ui" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Placeholder google-services.json and strings_other.xml
      run: |
        cat > app/google-services.json <<'JSON'
        {"project_info":{"project_number":"000000000000","project_id":"compile-check","storage_bucket":"compile-check.appspot.com"},
         "client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"nl.giejay.android.tv.immich"}},
                    "oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],
         "configuration_version":"1"}
        JSON
        cat > app/src/main/res/values/strings_other.xml <<'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="api_key" translatable="false">placeholder</string>
            <string name="authentication_url" translatable="false">https://example.invalid</string>
            <string name="host_name" translatable="false">https://example.invalid</string>
        </resources>
        XML
    - name: Build debug APK
      run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: immich-tv-debug.apk
        path: ./app/build/outputs/apk/debug/*.apk
