name: Compile check

# Debug build with placeholder Firebase/strings files, so pull requests can be
# compiled without the release secrets.
on:
  pull_request:
  push:
    branches: [ "redesign-ui" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Placeholder google-services.json and strings_other.xml
      run: |
        cat > app/google-services.json <<'JSON'
        {"project_info":{"project_number":"000000000000","project_id":"compile-check","storage_bucket":"compile-check.appspot.com"},
         "client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"nl.giejay.android.tv.immich"}},
                    "oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},
                    {"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000001","android_client_info":{"package_name":"nl.giejay.android.tv.immich.debug"}},
                    "oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],
         "configuration_version":"1"}
        JSON
        cat > app/src/main/res/values/strings_other.xml <<'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="api_key" translatable="false">placeholder</string>
            <string name="authentication_url" translatable="false">https://example.invalid</string>
            <string name="host_name" translatable="false">https://example.invalid</string>
        </resources>
        XML
    - name: Build debug APK
      run: |
        chmod +x gradlew
        set -o pipefail
        ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
    - name: Publish build log to ci-log branch on failure
      if: failure()
      run: |
        cp build.log /tmp/build.log
        grep -E "^e: |error:|FAILURE|What went wrong" -A3 /tmp/build.log | head -400 > /tmp/errors.txt || true
        git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
        git checkout --orphan ci-log
        git rm -rfq --cached . >/dev/null
        cp /tmp/build.log /tmp/errors.txt .
        git add build.log errors.txt
        git commit -qm "build log ${GITHUB_SHA}"
        git push -f origin ci-log
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: immich-tv-debug.apk
        path: ./app/build/outputs/apk/debug/*.apk
